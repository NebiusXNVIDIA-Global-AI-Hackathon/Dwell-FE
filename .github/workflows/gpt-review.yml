name: GPT Code Review

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: write

# 같은 PR에 연속 push하면 이전 리뷰 실행은 취소
concurrency:
  group: gpt-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: diff 추출
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 리뷰할 필요 없는 파일 제외: lock, 자동 생성 코드, 플랫폼 폴더, 바이너리 에셋
          git diff "origin/$BASE_REF"...HEAD -- . \
            ':(exclude)*.lock' \
            ':(exclude)*.g.dart' \
            ':(exclude)*.freezed.dart' \
            ':(exclude)ios/**' \
            ':(exclude)macos/**' \
            ':(exclude)linux/**' \
            ':(exclude)windows/**' \
            ':(exclude)android/gradle/wrapper/**' \
            ':(exclude)**/GeneratedPluginRegistrant*' \
            ':(exclude)build/**' \
            ':(exclude)assets/**' \
            ':(exclude)web/icons/**' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.ttf' \
            ':(exclude)*.otf' \
            > diff.txt

          SIZE=$(wc -c < diff.txt)
          # 60000자에서 자르되, 한글이 중간에 잘려 깨지지 않도록 정리
          head -c 60000 diff.txt | iconv -c -f utf-8 -t utf-8 > diff_trimmed.txt

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -gt 60000 ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GPT 리뷰 요청
        if: steps.diff.outputs.size != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          NOTE=""
          if [ "$TRUNCATED" = "true" ]; then
            NOTE="※ diff가 너무 길어 앞부분 60000자만 전달되었습니다."
          fi

          jq -n \
            --arg model "$MODEL" \
            --rawfile prompt .github/gpt-review-prompt.md \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg note "$NOTE" \
            --rawfile diff diff_trimmed.txt \
            '{
              model: $model,
              messages: [
                { role: "system", content: $prompt },
                { role: "user", content: ("PR 제목: " + $title + "\n\nPR 설명:\n" + $body + "\n\n" + $note + "\n\n```diff\n" + $diff + "\n```") }
              ]
            }' > request.json

          curl -sS --fail-with-body https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          # 응답이 비어 있으면 "null"이 코멘트로 달리지 않도록 실패 처리
          CONTENT=$(jq -r '.choices[0].message.content // empty' response.json)
          if [ -z "$CONTENT" ]; then
            echo "::error::OpenAI 응답에 리뷰 내용이 없습니다."
            cat response.json
            exit 1
          fi

          {
            echo "<!-- gpt-review -->"
            echo "## 🤖 GPT 코드리뷰"
            echo
            echo "$CONTENT"
            echo
            echo "---"
            echo "<sub>커밋 \`${GITHUB_SHA::7}\` 기준 · 모델: $MODEL · AI 리뷰는 참고용이며 최종 판단은 팀원 리뷰로 합니다.</sub>"
          } > review.md

      - name: PR 코멘트 작성/갱신
        if: steps.diff.outputs.size != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- gpt-review -->"))) | .id' \
            | tail -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@review.md
          else
            gh pr comment "$PR_NUMBER" --body-file review.md
          fi
